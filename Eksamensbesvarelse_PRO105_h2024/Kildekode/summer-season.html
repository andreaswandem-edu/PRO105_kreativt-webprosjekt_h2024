<!-- Ansvarlig for dokument: Billal -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorwayTrip</title>
    <link rel="stylesheet" href="css/summer-season.css">
</head>
<body>
    <!-- Navigasjonsmeny -->
    <nav>
        <ul>
            <li><a href="frontpage.html"><img src="img/symbols/summer-navbar.logo.png" alt="NorwayTrip logo">NorwayTrip</a></li>
            <li><a href="quiz.html" class="quiz-button">Quiz</a></li>
        </ul>
    </nav>

    <!-- Hovedinnhold -->
    <main>
        <!-- Tittel og informasjonstekst -->
        <h1>Explore summer destinations</h1>
        <p class="info-paragraph">Click on one of the cards to see more info</p>

        <!-- Beholder for destinasjonskortene -->
        <div class="container">

            <!-- Tunsenfryd -->
            <div class="card-container">
                <a href="destination-tusenfryd.html" class="card">
                    <p>Tusenfryd</p>
                </a>
                <div class="info-container">
                    <div class="rating-wrapper">
                        <ul class="rating-circles">
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.png" alt="Empty circle"></li>
                        </ul>
                        <p class="score">4/5</p>
                    </div>
                    <img src="img/symbols/summer-figure.child.circle.png" class="symbol" alt="child symbol">
                </div> 
            </div>

            <!-- Aker Brygge -->
            <div class="card-container">
                <a href="destination-aker-brygge.html" class="card">
                    <p>Aker Brygge</p>
                </a>
                <div class="info-container">
                    <div class="rating-wrapper">
                        <ul class="rating-circles">
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                        </ul>
                        <p class="score">5/5</p>
                    </div>
                    <img src="img/symbols/summer-handbag.circle.png" class="symbol" alt="handbag symbol">
                </div>
            </div>

            <!-- RIB-Safari -->
            <div class="card-container">
                <a href="destination-rib-safari.html" class="card">
                    <p>RIB-Safari</p>
                </a>
                <div class="info-container">
                    <div class="rating-wrapper">
                        <ul class="rating-circles">
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/summer-circle.png" alt="Empty circle"></li>
                        </ul>
                        <p class="score">4/5</p>
                    </div>
                    <img src="img/symbols/summer-sailboat.circle.png" class="symbol" alt="sailboat symbol">
                </div> 
            </div>
        </div>
    </main>

    <!-- Tilbake-knapp -->
    <div class="return-button">
        <a href="frontpage.html">
            <img src="img/symbols/summer-arrow.left.png" alt="Return to front page">
        </a>
    </div>
</body>
</html>
