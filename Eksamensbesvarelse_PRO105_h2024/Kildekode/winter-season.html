<!-- Ansvarlig for dokument: Billal -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorwayTrip</title>
    <link rel="stylesheet" href="css/winter-season.css">
</head>
<body>
    <!-- Navigasjonsmeny -->
    <nav>
        <ul>
            <li><a href="frontpage.html"><img src="img/symbols/winter-navbar.logo.png" alt="NorwayTrip logo">NorwayTrip</a></li>
            <li><a href="quiz.html" class="quiz-button">Quiz</a></li>
        </ul>
    </nav>

    <!-- Hovedinnhold -->
    <main>
        <!-- Tittel og informasjonstekst -->
        <h1>Explore winter destinations</h1>
        <p class="info-paragraph">Click on one of the cards to see more info</p>

        <!-- Beholder for destinasjonskortene -->
        <div class="container">

            <!-- Trysil -->
            <div class="card-container">
                <a href="destination-trysil.html" class="card">
                    <p>Trysil</p>
                </a>
                <div class="info-container">
                    <div class="rating-wrapper">
                        <ul class="rating-circles">
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.png" alt="Empty circle"></li>
                        </ul>
                        <p class="score">4/5</p>
                    </div>
                    <img src="img/symbols/winter-figure.skiing.circle.png" class="symbol" alt=" skiing symbol">
                </div> 
            </div>

            <!-- Korketrekkeren -->
            <div class="card-container">
                <a href="destination-korketrekkeren.html" class="card">
                    <p>Korketrekkern</p>
                </a>
                <div class="info-container">
                    <div class="rating-wrapper">
                        <ul class="rating-circles">
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.png" alt="Empty circle"></li>
                        </ul>
                        <p class="score">4/5</p>
                    </div>
                    <img src="img/symbols/winter-figure.fall.circle.png" class="symbol" alt="falling symbol">
                </div>
            </div>

            <!-- Stavkroa -->
            <div class="card-container">
                <a href="destination-stavkroa.html" class="card">
                    <p>Stavkroa</p>
                </a>
                <div class="info-container">
                    <div class="rating-wrapper">
                        <ul class="rating-circles">
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                            <li><img src="img/symbols/winter-circle.fill.png" alt="Filled circle"></li>
                        </ul>
                        <p class="score">5/5</p>
                    </div>
                    <img src="img/symbols/winter-figure.dance.circle.png" class="symbol" alt="dancing symbol">
                </div> 
            </div>
        </div>
    </main>

    <!-- Tilbake-knapp -->
    <div class="return-button">
        <a href="frontpage.html">
            <img src="img/symbols/winter-arrow.left.png" alt="Return to front page">
        </a>
    </div>
</body>
</html>
